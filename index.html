<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yahia & Alia's RSVP Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:wght@400;500;600;700&display=swap">
    <style>
        body {
            background-color: #f0f6fb;
            font-family: 'Playfair Display', serif;
            background-image: url('https://i.etsystatic.com/54691848/r/il/9abf84/6997927313/il_1588xN.6997927313_6ymw.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
            margin: 0;
            color: #333;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(240, 246, 251, 0.92);
            z-index: -1;
        }

        .handwritten {
            font-family: 'Dancing Script', cursive;
        }

        .luxury-card {
            box-shadow: 0 25px 50px -12px rgba(14, 116, 144, 0.12), 0 0 0 1px rgba(186, 230, 253, 0.6);
        }

        .text-gradient {
            background: linear-gradient(135deg, #0c4a6e 0%, #0369a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-3 sm:p-6">
    <div class="relative max-w-5xl w-full backdrop-blur-md bg-white/75 rounded-3xl overflow-hidden luxury-card fade-in my-4 p-4 sm:p-10">

        <!-- Header -->
        <div class="text-center pb-8 border-b border-blue-100/80 mb-8 space-y-2">
            <span class="text-xs uppercase tracking-[0.3em] text-sky-700 font-semibold">Live Guest Management</span>
            <h1 class="text-4xl sm:text-6xl font-bold text-gradient handwritten py-1">Yahia & Alia's RSVP</h1>
            <p class="text-sm sm:text-base text-sky-800 font-medium tracking-wide">November 27, 2026</p>
        </div>

        <!-- Summary Cards -->
        <div class="space-y-4 mb-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-white/90 p-6 rounded-2xl shadow-sm border border-blue-100/80 backdrop-blur-sm text-center">
                    <h3 class="text-xs uppercase tracking-widest text-gray-500 font-semibold mb-1">Total Invited Guests</h3>
                    <p class="text-4xl font-bold text-sky-800 handwritten" id="totalPrimary">0</p>
                </div>
                <div class="bg-white/90 p-6 rounded-2xl shadow-sm border border-blue-100/80 backdrop-blur-sm text-center">
                    <h3 class="text-xs uppercase tracking-widest text-gray-500 font-semibold mb-1">Total Plus Ones</h3>
                    <p class="text-4xl font-bold text-sky-800 handwritten" id="totalPlusOnes">0</p>
                </div>
            </div>
            <div class="bg-white/90 p-6 rounded-2xl shadow-sm border border-blue-100/80 backdrop-blur-sm text-center">
                <h3 class="text-xs uppercase tracking-widest text-gray-500 font-semibold mb-1">Total Combined Guests</h3>
                <p class="text-4xl font-bold text-sky-800 handwritten" id="totalCombined">0</p>
            </div>
        </div>

        <!-- Filters Bar -->
        <div class="flex flex-col gap-4 mb-8">
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="searchInput" class="flex-1 p-3 bg-white/90 border border-blue-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-700" placeholder="Filter by name..." onkeyup="filterTable()">
                
                <select id="responseFilter" class="flex-1 p-3 bg-white/90 border border-blue-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-700" onchange="filterTable()">
                    <option value="">All Attendance Responses</option>
                    <option value="Yes, can't wait!">Yes, can't wait!</option>
                    <option value="Sorry, can't make it">Sorry, can't make it</option>
                </select>

                <select id="extraFilter" class="flex-1 p-3 bg-white/90 border border-blue-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-700" onchange="filterTable()">
                    <option value="">All Plus One Options</option>
                </select>
            </div>

            <!-- Inviter Multi-Filter Pills Container -->
            <div class="bg-white/90 p-4 border border-blue-200 rounded-xl">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-2 gap-1">
                    <span class="text-xs uppercase tracking-widest text-gray-500 font-semibold">Filter by Inviter (Select multiple):</span>
                    <span class="text-xs font-semibold text-sky-800 bg-sky-50 px-2.5 py-1 rounded-md border border-blue-100 self-start sm:self-auto">
                        Selected Inviter Total: <span id="selectedInviterTotal" class="font-bold">0</span> guests
                    </span>
                </div>
                <div id="inviterFilters" class="flex flex-wrap gap-2">
                    <!-- Dynamic checkboxes/pills will be injected here -->
                </div>
            </div>
        </div>

        <!-- Data Table Wrapper -->
        <div class="w-full overflow-x-auto bg-white/90 rounded-2xl shadow-sm border border-blue-100/80">
            <table class="w-full border-collapse text-left whitespace-nowrap">
                <thead>
                    <tr id="tableHeaders" class="bg-sky-800 text-white text-sm"></tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-blue-50 text-sm text-gray-700">
                    <tr>
                        <td colspan="4" class="p-6 text-center italic text-gray-500">Loading RSVP data from Google Sheets...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Footer -->
        <div class="text-center text-xs sm:text-sm text-gray-600 pt-8 mt-8 border-t border-blue-100/80 space-y-1">
            <p class="handwritten text-3xl text-sky-900">Yahia & Alia</p>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRPkJHSujiT_SfZEgG8MMA9spUfWIAYDh-xEVZfS6rLwc4gNQe4kLC75eJTqBz9E8C1vS1rg4-8kRo-/pub?output=csv';

        let globalData = [];
        const hiddenColumns = [0, 4, 5, 6]; // Column G: Inviter name

        async function loadSheetData() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                parseCSV(data);
            } catch (error) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="4" class="p-6 text-center text-red-500 font-medium">Failed to load data. Please check your connection.</td></tr>`;
            }
        }

        function parseCSV(text) {
            let lines = text.split('\n').filter(line => line.trim() !== '');
            globalData = lines.map(line => {
                let row = [];
                let insideQuote = false;
                let currentVal = '';
                for (let i = 0; i < line.length; i++) {
                    let char = line[i];
                    if (char === '"') {
                        insideQuote = !insideQuote;
                    } else if (char === ',' && !insideQuote) {
                        row.push(currentVal.trim());
                        currentVal = '';
                    } else {
                        currentVal += char;
                    }
                }
                row.push(currentVal.trim());
                return row;
            });

            if (globalData.length > 0) {
                populateExtraDropdown(globalData.slice(1));
                populateInviterFilters(globalData.slice(1));
                renderDashboard(globalData);
                filterTable(); // <--- Added this to initialize the counts on first load!
            }
        }

        function populateExtraDropdown(dataRows) {
            let extraFilterSelect = document.getElementById('extraFilter');
            let uniqueValues = new Set();

            dataRows.forEach(row => {
                row.forEach(cell => {
                    if (cell.toLowerCase().includes("extra") || cell.toLowerCase().includes("just me")) {
                        uniqueValues.add(cell.trim());
                    }
                });
            });

            extraFilterSelect.innerHTML = '<option value="">All Plus One Options</option>';

            Array.from(uniqueValues).sort().forEach(val => {
                let opt = document.createElement('option');
                opt.value = val;
                opt.textContent = val;
                extraFilterSelect.appendChild(opt);
            });
        }

        function populateInviterFilters(dataRows) {
            let container = document.getElementById('inviterFilters');
            let uniqueInviters = new Set();

            dataRows.forEach(row => {
                let inviter = row[6] ? row[6].trim() : ""; // Column G is index 6
                if (inviter !== "") {
                    uniqueInviters.add(inviter);
                }
            });

            let html = `<label class="inline-flex items-center space-x-2 text-xs font-medium bg-sky-100/70 hover:bg-sky-200 text-sky-900 px-3 py-1.5 rounded-lg cursor-pointer transition-colors">
                <input type="checkbox" id="selectAllInviters" checked onchange="toggleAllInviters(this)" class="rounded text-sky-700 focus:ring-sky-600">
                <span>Select All</span>
            </label>`;

            Array.from(uniqueInviters).sort().forEach(inviter => {
                html += `<label class="inline-flex items-center space-x-2 text-xs font-medium bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg cursor-pointer transition-colors">
                    <input type="checkbox" name="inviterCheckbox" value="${inviter}" checked onchange="filterTable()" class="rounded text-sky-700 focus:ring-sky-600">
                    <span>${inviter}</span>
                </label>`;
            });

            container.innerHTML = html;
        }

        function toggleAllInviters(selectAllCheckbox) {
            let checkboxes = document.querySelectorAll('input[name="inviterCheckbox"]');
            checkboxes.forEach(cb => cb.checked = selectAllCheckbox.checked);
            filterTable();
        }

        function renderDashboard(rows) {
            let headers = rows[0];
            let dataRows = rows.slice(1);

            let headerHtml = '';
            headers.forEach((h, index) => {
                if (!hiddenColumns.includes(index)) {
                    headerHtml += `<th class="p-4 font-semibold tracking-wide">${h}</th>`;
                }
            });
            document.getElementById('tableHeaders').innerHTML = headerHtml;

            updateSummaryCards(dataRows);
            displayTableRows(dataRows);
        }

        function updateSummaryCards(rows) {
            let activePrimaryCount = rows.filter(row => {
                let colEVal = row[4] ? row[4].trim() : "";
                return colEVal === "1";
            }).length;
            
            let totalExtraAdults = rows.reduce((sum, row) => {
                let rowSum = 0;
                row.forEach(cell => {
                    if(cell.toLowerCase().includes("extra")) {
                        let match = cell.match(/\d+/);
                        if(match) rowSum += parseInt(match[0]);
                    }
                });
                return sum + rowSum;
            }, 0);

            let totalCombined = activePrimaryCount + totalExtraAdults;

            document.getElementById('totalPrimary').innerText = activePrimaryCount;
            document.getElementById('totalPlusOnes').innerText = totalExtraAdults;
            document.getElementById('totalCombined').innerText = totalCombined;
        }

        function calculateCombinedGuestsForRows(rows) {
            let activePrimaryCount = rows.filter(row => {
                let colEVal = row[4] ? row[4].trim() : "";
                return colEVal === "1";
            }).length;
            
            let totalExtraAdults = rows.reduce((sum, row) => {
                let rowSum = 0;
                row.forEach(cell => {
                    if(cell.toLowerCase().includes("extra")) {
                        let match = cell.match(/\d+/);
                        if(match) rowSum += parseInt(match[0]);
                    }
                });
                return sum + rowSum;
            }, 0);

            return activePrimaryCount + totalExtraAdults;
        }

        function displayTableRows(rows) {
            let bodyHtml = '';
            if(rows.length === 0) {
                bodyHtml = `<tr><td colspan="10" class="p-6 text-center text-gray-500 italic">No records found matching your filters</td></tr>`;
            } else {
                rows.forEach(row => {
                    bodyHtml += '<tr class="hover:bg-sky-50/50 transition-colors">';
                    row.forEach((cell, index) => {
                        if (!hiddenColumns.includes(index)) {
                            bodyHtml += `<td class="p-4">${cell}</td>`;
                        }
                    });
                    bodyHtml += '</tr>';
                });
            }
            document.getElementById('tableBody').innerHTML = bodyHtml;
        }

        function filterTable() {
            let nameInput = document.getElementById('searchInput').value.toLowerCase();
            let responseVal = document.getElementById('responseFilter').value;
            let extraVal = document.getElementById('extraFilter').value;

            let selectedInviters = Array.from(document.querySelectorAll('input[name="inviterCheckbox"]:checked'))
                                        .map(cb => cb.value);

            let dataRows = globalData.slice(1);

            let filtered = dataRows.filter(row => {
                let matchesName = row.some((cell, index) => {
                    if (hiddenColumns.includes(index)) return false;
                    return cell.toLowerCase().includes(nameInput);
                });

                let matchesResponse = true;
                if (responseVal !== "") {
                    matchesResponse = row.some(cell => cell.trim() === responseVal);
                }

                let matchesExtra = true;
                if (extraVal !== "") {
                    matchesExtra = row.some(cell => cell.trim() === extraVal);
                }

                let rowInviter = row[6] ? row[6].trim() : "";
                let matchesInviter = selectedInviters.includes(rowInviter);

                return matchesName && matchesResponse && matchesExtra && matchesInviter;
            });

            // Calculate and update the specific inviter subtotal badge based ONLY on the inviter filter selection
            let inviterFilteredRows = dataRows.filter(row => {
                let rowInviter = row[6] ? row[6].trim() : "";
                return selectedInviters.includes(rowInviter);
            });
            let selectedInviterCombinedCount = calculateCombinedGuestsForRows(inviterFilteredRows);
            document.getElementById('selectedInviterTotal').innerText = selectedInviterCombinedCount;

            displayTableRows(filtered);
        }

        loadSheetData();
    </script>
</body>

</html>
